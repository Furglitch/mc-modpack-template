name: Create New Modpack

on:
  workflow_dispatch:
    inputs:
      modpack_name:
        description: 'Modpack Name'
        required: true
        default: 'MODPACK NAME'
      modpack_version:
        description: 'Modpack Version'
        required: false
        default: '1.0.0'
      modpack_author:
        description: 'Modpack Author'
        required: true
        default: 'YOUR NAME HERE'

permissions:
  contents: write

jobs:
  update-pack:
    name: Update Modpack Info
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Download packwiz binary
        uses: dawidd6/action-download-artifact@v12
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: go.yml
          repo: AmberIsFrozen/packwiz
          name: Linux 64-bit x86
          path: ./packwiz-bin

      - name: Install packwiz
        run: |
          chmod +x ./packwiz-bin/packwiz
          sudo mv ./packwiz-bin/packwiz /usr/local/bin/

      - name: Update pack.toml
        env:
          NAME: ${{ inputs.modpack_name }}
          VERSION: ${{ inputs.modpack_version }}
          AUTHOR: ${{ inputs.modpack_author }}
        run: |
          set -euo pipefail
          file="packwiz/pack.toml"
          if [ ! -f "$file" ]; then
            echo "$file not found"
            exit 1
          fi
          # Replace name, version, author preserving quoting
          sed -E -i "s/^(name\s*=\s*\").*(\")/\1${NAME//\//\\\/}\2/" "$file"
          sed -E -i "s/^(version\s*=\s*\").*(\")/\1${VERSION//\//\\\/}\2/" "$file"
          sed -E -i "s/^(author\s*=\s*\").*(\")/\1${AUTHOR//\//\\\/}\2/" "$file"
          git add "$file"

      - name: Refresh pack index
        working-directory: ./packwiz
        run: packwiz refresh || true

      - name: Move template README into .github/docs/
        run: |
          set -euo pipefail
          mkdir -p .github/docs
          if git ls-files --error-unmatch README.md >/dev/null 2>&1; then
            git mv README.md .github/docs/TEMPLATE.md
          else
            if [ -f README.md ]; then
              mv README.md .github/docs/TEMPLATE.md
              git add .github/docs/TEMPLATE.md
            fi
          fi

      - name: Remove Github Pages files
        run: |
          set -euo pipefail
          if [ -d docs ]; then
            git rm -rf docs
          fi
          if [ -f .github/workflows/pages.yml ]; then
            git rm -f .github/workflows/pages.yml
          fi

      - name: Remove FUNDING.yml
        run: |
          if [ -f .github/FUNDING.yml ]; then
            git rm -f .github/FUNDING.yml || true
          fi

      - name: Remove this workflow
        run: |
          if [ -f .github/workflows/create-pack.yml ]; then
            git rm -f .github/workflows/create-pack.yml || true
          fi
      
      - name: Remove dispatch-modloader-updates workflow
        run: |
          if [ -f .github/workflows/dispatch-modloader-updates.yml ]; then
            git rm -f .github/workflows/dispatch-modloader-updates.yml || true
          fi

      - name: Commit and push changes
        run: |
          if git status --porcelain | grep . >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: Initial modpack setup via create-pack workflow"
            git push origin HEAD:1.21.1-NeoForge
          else
            echo "No changes to commit"
          fi
