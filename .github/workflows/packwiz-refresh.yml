name: Refresh Mod Index

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [ 1.21.1-NeoForge ]
    paths:
      - 'packwiz/**'
      - '.github/workflows/packwiz-refresh.yml'
  pull_request:
    branches: [ 1.21.1-NeoForge ]
    paths:
      - 'packwiz/**'
      - '.github/workflows/packwiz-refresh.yml'

concurrency:
  group: commit-updaters-1211NF-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    name: Refresh Mod Index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Pull changes from other workflows
        run: git pull --rebase

      - name: Download packwiz binary
        uses: dawidd6/action-download-artifact@v12
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: go.yml
          repo: AmberIsFrozen/packwiz
          name: Linux 64-bit x86
          path: ./packwiz-bin

      - name: Install packwiz
        run: |
          chmod +x ./packwiz-bin/packwiz
          sudo mv ./packwiz-bin/packwiz /usr/local/bin/

      - name: Refresh pack index
        working-directory: ./packwiz
        run: packwiz refresh || true

      - name: Commit refresh
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: refresh packwiz index"
            git push origin HEAD:${{ github.ref_name }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}