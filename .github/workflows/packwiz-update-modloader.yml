name: Update Modloader Version

on:
  schedule:
    - cron: '0 0 * * 1'
    # - timezone: 'America/New_York' <- Not yet supported : https://github.com/github/roadmap/issues/1187
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  maven_repo: "https://maven.fabricmc.net"
  maven_path: "net/fabricmc/fabric-loader"
  prefix: ""
  pack_file: "packwiz/pack.toml"

jobs:
  update-modloader:
    name: Update Fabric Modloader
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Parse latest/current Fabric Modloader
        id: parse
        run: |
          set -euo pipefail
          tmp=/tmp/maven-metadata.xml
          url="$maven_repo/$maven_path/maven-metadata.xml"
          echo "Fetching $url"
          curl -fsSL "$url" -o "$tmp"
          versions=$(awk -F'[<>]' '/<version>/{print $3}' "$tmp" || true)
          PREFIX_REGEX=$(printf '%s' "$prefix" | sed 's/\./\\./g')
          latest=$(printf "%s\n" $versions | grep -E "^${PREFIX_REGEX}" | sort -V | tail -n1 || true)
          current=$(sed -n 's/^fabric\s*=\s*"\([^"]*\)".*/\1/p' "$pack_file" || true)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Update pack.toml
        if: ${{ steps.parse.outputs.latest != '' && steps.parse.outputs.latest != steps.parse.outputs.current }}
        run: |
          set -euo pipefail
          latest="${{ steps.parse.outputs.latest }}"
          echo "Updating $pack_file -> $latest"
          sed -E -i "s/^(fabric\s*=\s*\").*(\")/\1${latest}\2/" "$pack_file"
          git add "$pack_file"

      - name: Create branch name
        id: branch_name
        if: ${{ steps.parse.outputs.latest != '' && steps.parse.outputs.latest != steps.parse.outputs.current }}
        run: |
          latest="${{ steps.parse.outputs.latest }}"
          sanitized_version=$(printf '%s' "$latest" | sed 's/\./-/g')
          sanitized_branch=$(printf '%s' "${{ github.ref_name }}" | sed 's/\./-/g')
          branch="github-actions/${sanitized_branch}/packwiz/update/fabric-${sanitized_version}"
          echo "branch=$branch" >> $GITHUB_OUTPUT

      - name: Prepare git user
        if: ${{ steps.parse.outputs.latest != '' && steps.parse.outputs.latest != steps.parse.outputs.current }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compose PR body
        id: compose
        if: ${{ steps.parse.outputs.latest != '' && steps.parse.outputs.latest != steps.parse.outputs.current }}
        run: |
          set -euo pipefail
          latest="${{ steps.parse.outputs.latest }}"
          current="${{ steps.parse.outputs.current }}"
          pr_file=/tmp/pr_body.txt

          echo "Bumps fabric in /packwiz/pack.toml from ${current} to ${latest}." > "$pr_file"
          echo "" >> "$pr_file"

          release_api_url="https://api.github.com/repos/FabricMC/fabric-loader/releases/tags/${latest}"
          if curl -fsSL -H "Accept: application/vnd.github.v3+json" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$release_api_url" -o /tmp/release.json; then
            # Extract the release body using Perl's JSON::PP (no python required)
            perl -MJSON::PP -0777 -ne 'eval{print decode_json($_)->{body}}' /tmp/release.json > /tmp/changelog.txt || true

            if [ -n "$current" ]; then
              awk -v old="$current" 'BEGIN{pat="`"old"`"} $0 ~ pat {exit} {print}' /tmp/changelog.txt > /tmp/changelog_trimmed.txt || true
              if [ ! -s /tmp/changelog_trimmed.txt ]; then
                cp /tmp/changelog.txt /tmp/changelog_trimmed.txt || true
              fi
            else
              cp /tmp/changelog.txt /tmp/changelog_trimmed.txt || true
            fi

            echo "<details>" >> "$pr_file"
            echo "<summary>Release notes</summary>" >> "$pr_file"
            echo "" >> "$pr_file"
            # Append the release body verbatim (preserve original markdown)
            cat /tmp/changelog_trimmed.txt >> "$pr_file" || true
            echo "" >> "$pr_file"
            echo "</details>" >> "$pr_file"
          else
            echo "Release notes not found at $release_api_url" >> "$pr_file"
          fi

          {
            echo "body<<EOF"
            cat "$pr_file"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: ${{ steps.parse.outputs.latest != '' && steps.parse.outputs.latest != steps.parse.outputs.current }}
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ steps.branch_name.outputs.branch }}
          commit-message: "chore(deps): bump fabric from ${{ steps.parse.outputs.current }} to ${{ steps.parse.outputs.latest }} in /packwiz/pack.toml"
          title: "chore(deps): bump fabric from ${{ steps.parse.outputs.current }} to ${{ steps.parse.outputs.latest }} in /packwiz/pack.toml"
          body: ${{ steps.compose.outputs.body }}
          delete-branch: false